name: rebuild-pagr

# This repo holds the CV; danieldeusing.de PUBLISHES it. pagr's build fetches the PDFs and
# data/cv.*.json from this repo's main at build time (its scripts/sync-content.mjs), so a
# commit here changes nothing on the live site until pagr rebuilds. This workflow is what
# makes that happen.
#
# It replaces a cv/.git/hooks/post-commit that pagr's README documented for years and that
# existed on no machine: this repo had no local clone, no workflows and no secrets, so a
# regenerated CV only ever reached the site when some unrelated pagr deploy happened to run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here needs the automatic GITHUB_TOKEN: the dispatch below authenticates with its
# own PAT, and this job reads nothing out of this repository.
permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Deliberately NOT narrowed with a paths: filter. Getting such a filter wrong fails
      # silently — a real CV change that never reaches the site — while the cost of omitting
      # it is one unnecessary ~1 min deploy, on a repo that sees a handful of pushes a year.
      # That trade only runs one way.
      # A GitHub App, not a PAT. The App mints a token that lives ONE HOUR, so this public
      # repo holds no long-lived credential and there is no expiry date to remember — which
      # is why this replaced PAGR_DISPATCH_TOKEN instead of making that PAT never-expire.
      # The automatic GITHUB_TOKEN cannot stand in: it is scoped to the repository it runs
      # in and cannot start a workflow in another one.
      #
      # owner + repositories are REQUIRED, not decoration: without them the minted token is
      # scoped to THIS repository, and reaching another one is the entire job.
      # client-id, not app-id: v3 deprecates app-id and warns on every run. The App's item in
      # the vault carries both, so this costs nothing.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PAGR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGR_APP_PRIVATE_KEY }}
          owner: danieldeusing
          repositories: pagr

      - name: Trigger the pagr deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run deploy.yml --repo danieldeusing/pagr --ref master
          echo "Dispatched. The deploy reports its own success or failure here:"
          echo "https://github.com/danieldeusing/pagr/actions/workflows/deploy.yml"
